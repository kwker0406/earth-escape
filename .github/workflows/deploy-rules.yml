# database.rules.json이 바뀌어 올라오면 Firebase 실시간 데이터베이스 규칙을 자동으로 적용한다.
# 열쇠(서비스 계정 JSON)는 저장소 Settings → Secrets의 FIREBASE_SERVICE_ACCOUNT에만 둔다(파일로 올리지 말 것).
name: Firebase 규칙 배포
on:
  push:
    branches: [main]
    paths: [database.rules.json, firebase.json, .github/workflows/deploy-rules.yml]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 규칙 문법 확인 + 배포
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 비밀 값이 없습니다"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
          npx --yes firebase-tools@13 deploy --only database --project mini-game-f56d8 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
