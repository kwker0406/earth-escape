<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 관리 · 과학실의 그림자: 보충의 밤</title>
<style>
  :root { --bg:#16131f; --panel:#221d30; --line:#3a3150; --text:#f3eefc; --dim:#a79cc0; --hot:#ff7a3d; --ok:#5ad19a; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  button, input, select { font:inherit; }
  button { cursor:pointer; border:0; border-radius:10px; padding:10px 14px; background:var(--line); color:var(--text); }
  button:disabled { opacity:.4; cursor:default; }
  button.hot { background:var(--hot); color:#fff; font-weight:700; }
  button.bad { background:none; border:1px solid var(--bad); color:var(--bad); }
  header { display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  header small { color:var(--dim); }
  #url { color:var(--text); font-weight:700; }
  #login { display:grid; place-items:center; gap:12px; padding:80px 20px; text-align:center; }
  #main { display:none; grid-template-columns:260px 1fr; min-height:calc(100vh - 60px); }
  @media (max-width:760px) { #main { grid-template-columns:1fr; } }
  aside { padding:16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  aside h2, #board h2 { margin:6px 0; font-size:15px; color:var(--dim); font-weight:600; }
  #classes { display:flex; flex-direction:column; gap:6px; }
  #classes button { text-align:left; background:var(--panel); }
  #classes button.sel { outline:2px solid var(--hot); }
  form { display:grid; gap:8px; background:var(--panel); padding:12px; border-radius:12px; }
  form label { display:grid; gap:4px; font-size:13px; color:var(--dim); }
  form input, form select { padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  #board { padding:20px; }
  #empty { color:var(--dim); padding:40px 0; }
  #top { display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; margin-bottom:18px; }
  #cname { font-size:24px; font-weight:800; margin:0; }
  #clock { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; }
  #state { padding:4px 10px; border-radius:99px; background:var(--line); font-size:14px; }
  #controls { display:flex; flex-wrap:wrap; gap:8px; }
  #teams { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap:12px; }
  .team { background:var(--panel); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .team h3 { margin:0; display:flex; justify-content:space-between; align-items:baseline; font-size:16px; }
  .team h3 small { color:var(--dim); font-weight:400; }
  .code { font-size:38px; font-weight:800; letter-spacing:6px; color:var(--hot); }
  .team select.level { margin:4px 0 8px; padding:4px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:inherit; font:inherit; }
  #ranking { display:flex; flex-wrap:wrap; gap:8px; margin:-6px 0 14px; font-size:14px; }
  #ranking span { background:var(--panel); border-radius:99px; padding:4px 12px; }
  #ranking span:first-child { background:var(--hot); color:#fff; font-weight:700; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .row canvas { width:100%; height:auto; border-radius:6px; background:#0d0b14; } /* 카드 폭에 맞춰 줄어듦(고정 폭이면 옆 카드를 덮음) */
  .prog { flex:1; min-width:140px; font-size:13px; color:var(--dim); display:grid; gap:6px; }
  .prog b { color:var(--text); font-size:15px; }
  .bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .team ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .team li { display:flex; align-items:center; gap:8px; }
  .team li .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
  .team li.off { opacity:.5; } .team li.off .dot { background:var(--dim); }
  .team li span.n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .team li button { padding:2px 8px; font-size:12px; }
  #err { color:var(--bad); }
  .team .kicked { border-top:1px dashed var(--line); padding-top:8px; font-size:13px; color:var(--dim); }
  .team .kicked li { opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>🌡️ 교사 관리</h1>
  <small>학생 접속 주소: <span id="url"></span></small>
  <small id="who"></small>
</header>

<section id="login">
  <p>교사용 구글 계정으로 로그인하세요.</p>
  <button id="loginBtn" class="hot">구글로 로그인</button>
  <p id="err" role="alert"></p>
</section>

<section id="main">
  <aside>
    <h2>내 반 목록</h2>
    <div id="classes"></div>
    <h2>새 반 만들기</h2>
    <form id="newClass">
      <label>반 이름 <input name="name" required maxlength="20" placeholder="예: 1학년 3반"></label>
      <label>팀 수 <select name="teams">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option></select></label>
      <label>팀당 최대 인원 <select name="size"><option>3</option><option selected>4</option><option>5</option></select></label>
      <label>게임 시간(분) <input name="min" type="number" min="5" max="90" value="40"></label>
      <label>난이도(팀마다 나중에 바꿀 수 있음) <select name="level"><option value="easy">쉬움 · 퍼즐 9개</option><option value="normal" selected>보통 · 퍼즐 11개</option><option value="hard">어려움 · 퍼즐 13개</option></select></label>
      <label>보충수업실 대기 <select name="jail"><option value="30" selected>30초</option><option value="45">45초</option><option value="60">60초</option></select></label>
      <button class="hot">만들기 (팀 코드 자동 발급)</button>
    </form>
  </aside>

  <div id="board">
    <p id="empty">왼쪽에서 반을 고르거나 새로 만드세요.</p>
    <div id="view" hidden>
      <div id="top">
        <h2 id="cname"></h2>
        <span id="clock">--:--</span>
        <span id="state"></span>
        <div id="controls">
          <button class="hot" data-act="start">▶ 시작</button>
          <button data-act="pause">⏸ 일시정지</button>
          <button data-act="plus5">+5분</button>
          <button data-act="plus10">+10분</button>
          <button id="reset">🔄 처음부터 다시</button>
          <button data-act="end">🏁 종료</button>
          <button class="bad" id="del">반 삭제(초기화)</button>
        </div>
      </div>
      <div id="ranking"></div>
      <div id="teams"></div>
    </div>
  </div>
</section>

<script type="module">
import * as net from "./net.js";
import { MAPS, FLOORS } from "./maps.js";
import { FLOOR_NAMES, LEVELS } from "./puzzles.js";
import { phaseAt, sightTiles } from "./monsters.js";
import { CHARS, sprite } from "./sprites.js";
const $ = id => document.getElementById(id);
const AVATARS = CHARS.map(c => c.emoji);
const STATE = { wait: "시작 전", play: "진행 중", pause: "일시정지", end: "종료" };
$("url").textContent = new URL("./", location.href).href;

let current = null, stopWatch = null, data = null, pending = null, cardSig = "";

$("loginBtn").onclick = async () => {
  $("err").textContent = "";
  try {
    const email = await net.teacherLogin();
    $("who").textContent = email;
    net.onClasses(showClasses, () => {
      $("main").style.display = "none"; $("login").style.display = "grid";
      $("err").textContent = `${email} 은(는) 교사로 등록된 계정이 아니에요. 보안 규칙의 이메일을 확인하세요.`;
    });
    $("login").style.display = "none"; $("main").style.display = "grid";
  } catch (e) { $("err").textContent = "로그인에 실패했어요: " + e.message; }
};

net.teacherEmail().then(e => { if (e) $("loginBtn").click(); }); // 이미 로그인돼 있으면 바로 들어감(창을 새로 열거나 돌아와도)

function showClasses(list) {
  const ids = Object.keys(list).sort((a, b) => list[b].createdAt - list[a].createdAt);
  $("classes").replaceChildren(...ids.map(id => {
    const b = document.createElement("button");
    b.textContent = list[id].name; b.dataset.id = id; b.classList.toggle("sel", id === current);
    b.onclick = () => open(id);
    return b;
  }));
  if (current && !list[current]) close();
}

function open(id) {
  stopWatch?.(); current = id;
  [...$("classes").children].forEach(b => b.classList.toggle("sel", b.dataset.id === id));
  $("empty").hidden = true; $("view").hidden = false;
  stopWatch = net.watchClass(id, d => { data = d; pending ??= setTimeout(() => { pending = null; render(); }, 250); }); // 이동이 잦아 0.25초마다 한 번만 다시 그림
}
function close() { stopWatch?.(); stopWatch = null; current = null; data = null; $("view").hidden = true; $("empty").hidden = false; }

$("newClass").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target), btn = e.target.querySelector("button");
  btn.disabled = true;
  try { open(await net.createClass(f.get("name").trim(), +f.get("teams"), +f.get("size"), +f.get("min"), +f.get("jail"), f.get("level"))); e.target.reset(); }
  catch (err) { alert("반을 만들지 못했어요: " + err.message); }
  btn.disabled = false;
};

for (const b of $("controls").querySelectorAll("[data-act]")) b.onclick = () => net.control(current, b.dataset.act);
$("reset").onclick = () => confirm(`'${data?.meta?.name}' 반을 처음부터 다시 할까요?\n팀 코드와 접속한 학생은 그대로 두고, 진행 상황·단서·보충 기록과 시간을 처음으로 되돌립니다. 퍼즐 정답도 새로 바뀝니다.`)
  && net.resetClass(current);
$("del").onclick = async () => {
  const name = data?.meta?.name;
  if (prompt(`'${name}' 반의 기록과 팀 코드를 모두 지웁니다.\n접속한 학생은 모두 첫 화면으로 돌아갑니다.\n지우려면 반 이름을 그대로 입력하세요.`) !== name) return;
  const id = current; close(); await net.deleteClass(id);
};

const left = m => m.state === "play" ? m.endsAt - net.serverNow() : m.remain ?? 0;
function clock() {
  if (!data?.meta) return;
  const sec = Math.ceil(Math.max(0, left(data.meta)) / 1000);
  $("clock").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  const over = data.meta.state === "play" && sec === 0;
  $("state").textContent = over ? "시간 종료" : STATE[data.meta.state];
  if (data.meta.state === "play") pending ??= setTimeout(() => { pending = null; render(); }, 250); // 괴물이 움직이므로 작은 지도 갱신
}
setInterval(clock, 500);

// 팀별 작은 지도: 벽과 접속 중인 팀원·괴물 위치. 카드는 그대로 두고 지도만 다시 칠한다.
const minis = {}, sizeOf = MAP => Math.max(2, Math.min(7, Math.floor(360 / MAP[0].length))); // 큰 층(71칸)도 카드에 들어가게
const mmss = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const floorOf = code => { const f = data.progress[code]?.at; return MAPS[f]?.[1] ? f : 1; }; // 팀이 지금 있는 층(처음·옛 기록은 1층)
function miniMap(code, members) {
  const cv = minis[code] = document.createElement("canvas"), dpr = devicePixelRatio || 1, MAP = MAPS[floorOf(code)], S = sizeOf(MAP);
  cv.width = MAP[0].length * S * dpr; cv.height = MAP.length * S * dpr;
  cv.style.maxWidth = MAP[0].length * S + "px";
  cv.setAttribute("aria-label", `${data.meta.teams[code]}팀 위치 지도`);
  paintMini(cv, code, members);
  return cv;
}
// 층 지도 바탕은 층·크기마다 한 번만 칠해 두고(8천 칸), 0.25초마다는 그 그림을 붙인 뒤 사람·괴물만 그림
const miniBg = new Map();
function mapImage(f, S, dpr) {
  const k = `${f}|${S}|${dpr}`; if (miniBg.has(k)) return miniBg.get(k);
  const MAP = MAPS[f], c = document.createElement("canvas"); c.width = MAP[0].length * S * dpr; c.height = MAP.length * S * dpr;
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  MAP.forEach((row, y) => [...row].forEach((ch, x) => {
    g.fillStyle = "#Yw".includes(ch) ? "#3a3150" : "+Gabcr".includes(ch) ? "#8a4b2a" : "CKRVWX".includes(ch) ? "#2f6b4f" : ch === "H" ? "#7a5a3a" : ch === "j" ? "#4a2228" : ch === "," ? "#2c3440" : "DBTLPEUFNOQA".includes(ch) ? "#3e3646" : /\d/.test(ch) ? "#2b3a55" : "#211c2e";
    g.fillRect(x * S, y * S, S, S);
  }));
  miniBg.set(k, c); return c;
}
function paintMini(cv, code, members) {
  const g = cv.getContext("2d"), dpr = devicePixelRatio || 1, f = floorOf(code), MAP = MAPS[f], S = sizeOf(MAP); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.drawImage(mapImage(f, S, dpr), 0, 0, MAP[0].length * S, MAP.length * S);
  g.font = `${S * 1.6}px sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#ff3b3b";
  const ph = phaseAt(net.gameMs(data.meta), data.meta.seed ?? 1, data.meta.levels?.[code]), mo = data.monster[code]?.f === f ? data.monster[code] : null;
  if (ph.phase === "chase" && mo?.n === ph.n && !mo.tid) {
    g.fillStyle = "rgba(255, 45, 45, 0.25)";
    for (const k of sightTiles(MAP, mo).keys()) { const [x, y] = k.split(",").map(Number); g.fillRect(x * S, y * S, S, S); }
    g.fillStyle = "#ff3b3b";
  }
  if (ph.phase === "chase" && mo?.n === ph.n) { g.beginPath(); g.arc(mo.x * S + S / 2, mo.y * S + S / 2, S * 0.6, 0, 7); g.fill(); }
  for (const [kid, v] of members) {
    const q = data.pos[code]?.[kid];
    if (v.online && q && (q.f ?? 0) === f) { g.imageSmoothingEnabled = true; g.drawImage(sprite(v.avatar ?? 0, q.d || "d"), q.x * S - S / 2, q.y * S - S / 2, S * 2, S * 2); }
  }
}

function render() {
  const m = data?.meta; if (!m) return;
  $("cname").textContent = m.name;
  $("controls").querySelector('[data-act="start"]').disabled = m.state === "play";
  $("controls").querySelector('[data-act="pause"]').disabled = m.state !== "play";
  const codes = Object.keys(m.teams).sort((a, b) => m.teams[a] - m.teams[b]);
  const membersOf = code => Object.entries(data.members[code] || {}).filter(([, v]) => v.nick);
  // 위치만 바뀌었으면 카드는 그대로 두고 작은 지도만 다시 칠함(다시 만들면 교사가 누르던 버튼이 사라져 클릭이 씹힘)
  const sig = JSON.stringify([current, m.name, m.teams, m.levels, m.state === "wait", m.maxMembers, data.members, data.kicked, data.progress,
    codes.map(c => Object.entries(data.pos[c] || {}).filter(([, q]) => q.jail).map(([k]) => k))]);
  if (sig === cardSig) { codes.forEach(c => minis[c] && paintMini(minis[c], c, membersOf(c))); return clock(); }
  cardSig = sig;
  const pr = code => { const p = { floor: 0, wrong: 0, score: 0, ...data.progress[code] }; return { ...p, solved: Object.keys(p.solved || {}).length }; };
  // 순위: 탈출한 팀은 탈출 시간이 빠른 순, 나머지는 연 층 → 푼 퍼즐 수 순
  const esc = c => pr(c).escaped ? pr(c).escapedMs ?? 0 : Infinity;
  const ranked = [...codes].sort((a, b) => esc(a) - esc(b) || pr(b).floor - pr(a).floor || pr(b).solved - pr(a).solved);
  const rank = Object.fromEntries(ranked.map((c, i) => [c, i + 1]));
  $("ranking").replaceChildren(...ranked.map(c => {
    const s = document.createElement("span"); s.textContent = `${rank[c]}위 ${m.teams[c]}팀 · ${pr(c).escaped ? "⏱ " + mmss(esc(c)) : "해결 " + pr(c).solved}`; return s;
  }));
  $("teams").replaceChildren(...codes.map(code => {
    const members = membersOf(code);
    const card = document.createElement("div"); card.className = "team";
    const h = document.createElement("h3");
    h.append(`${rank[code]}위 · ${m.teams[code]}팀`); const sm = document.createElement("small");
    if (pr(code).escaped) h.append(" 🎉 탈출!");
    sm.textContent = `${members.filter(([, v]) => v.online).length}명 접속 / 최대 ${m.maxMembers}명`; h.append(sm);
    const c = document.createElement("div"); c.className = "code"; c.textContent = code;
    const lv = document.createElement("select"); lv.className = "level"; // 팀 난이도: 시작 전에만 바꿈(중간에 바꾸면 퍼즐이 달라져 헷갈림)
    for (const [k, v] of Object.entries(LEVELS)) lv.append(new Option(`난이도: ${v}`, k));
    lv.value = m.levels?.[code] ?? "hard"; lv.disabled = m.state !== "wait"; lv.title = lv.disabled ? "시작 전(또는 '처음부터 다시' 뒤)에만 바꿀 수 있어요" : "";
    lv.onchange = () => net.setLevel(current, code, lv.value);
    const ul = document.createElement("ul");
    for (const [kid, v] of members) {
      const li = document.createElement("li"); if (!v.online) li.classList.add("off");
      const dot = document.createElement("i"); dot.className = "dot";
      const n = document.createElement("span"); n.className = "n"; n.textContent = `${AVATARS[v.avatar] ?? "❔"} ${v.nick}${v.caught ? ` · 보충 ${v.caught}회` : ""}`;
      const k = document.createElement("button"); k.textContent = "내보내기";
      k.onclick = () => confirm(`${v.nick} 학생을 내보낼까요?\n'다시 받기'를 누르기 전까지 이 기기로는 이 팀에 들어올 수 없어요.`) && net.kick(current, code, kid);
      li.append(dot, n, k); ul.append(li);
    }
    const p = pr(code), row = document.createElement("div"); row.className = "row";
    const prog = document.createElement("div"); prog.className = "prog";
    const fl = document.createElement("b"); fl.textContent = p.escaped ? `탈출 성공 ⏱ ${mmss(p.escapedMs ?? 0)}` : FLOOR_NAMES[p.at ?? 1];
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("i"); fill.style.width = `${p.escaped ? 100 : p.floor / FLOORS * 100}%`; bar.append(fill);
    const jailed = members.filter(([kid]) => data.pos[code]?.[kid]?.jail).length;
    const st = document.createElement("span"); st.textContent = `해결 ${p.solved} · 오답 ${p.wrong} · 🔒 ${jailed}명 · 보충 ${members.reduce((n, [, v]) => n + (v.caught || 0), 0)}회`;
    const hb = document.createElement("button"); hb.textContent = "📢 힌트 보내기";
    hb.onclick = () => { const t = prompt(`${m.teams[code]}팀에 보낼 힌트`, data.hint?.[code]?.text ?? ""); if (t?.trim()) net.sendHint(current, code, t.trim().slice(0, 120)); };
    prog.append(fl, bar, st, hb);
    row.append(miniMap(code, members), prog);
    card.append(h, c, lv, row, ul);
    const out = Object.entries(data.kicked[code] || {});
    if (out.length) {
      const box = document.createElement("div"); box.className = "kicked"; box.append("내보낸 학생");
      const ul2 = document.createElement("ul");
      for (const [kid, nick] of out) {
        const li = document.createElement("li");
        const n = document.createElement("span"); n.className = "n"; n.textContent = typeof nick === "string" ? nick : "이름 없음";
        const r = document.createElement("button"); r.textContent = "다시 받기";
        r.onclick = () => net.unkick(current, code, kid);
        li.append(n, r); ul2.append(li);
      }
      box.append(ul2); card.append(box);
    }
    return card;
  }));
  clock();
}
</script>
</body>
</html>
