<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>과학실의 그림자: 보충의 밤</title>
<style>
  :root { --bg:#16131f; --panel:#221d30; --line:#3a3150; --text:#f3eefc; --dim:#a79cc0; --hot:#ff7a3d; --ok:#5ad19a; }
  /* 화면이 끌려가지 않게: 고정 + 스크롤·확대·당겨서 새로고침·글자 선택 차단 */
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  input, button { touch-action:manipulation; font:inherit; }
  input { user-select:text; -webkit-user-select:text; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }

  /* 입장 화면 */
  #join { padding: max(24px, env(safe-area-inset-top)) 20px 24px; gap:14px; overflow-y:auto; touch-action:pan-y; }
  #join h1 { margin:8px 0 0; font-size:24px; } #join p { margin:0; color:var(--dim); font-size:14px; }
  label { font-size:14px; color:var(--dim); }
  .field { width:100%; box-sizing:border-box; padding:14px; font-size:18px; border-radius:12px; border:2px solid var(--line);
    background:var(--panel); color:var(--text); }
  #code { text-transform:uppercase; letter-spacing:6px; text-align:center; font-weight:700; }
  #avatars { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  #avatars button { aspect-ratio:1; font-size:34px; border-radius:14px; border:3px solid var(--line); background:var(--panel); }
  #avatars button.sel { border-color:var(--hot); background:#3a2a2a; }
  .big { padding:16px; font-size:18px; font-weight:700; border:0; border-radius:14px; background:var(--hot); color:#fff; }
  #msg { min-height:20px; color:#ff8f8f; font-size:14px; }

  /* 게임 화면: 위쪽 지도, 아래쪽 조작판 */
  #game { height:100dvh; }
  #hud { display:flex; justify-content:space-between; align-items:center; padding: max(8px, env(safe-area-inset-top)) 14px 8px;
    font-size:14px; color:var(--dim); }
  #hud b { color:var(--text); letter-spacing:2px; }
  #hud button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:4px 8px; }
  #mapbox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  #status { position:absolute; inset:0; display:none; place-items:center; text-align:center; font-size:22px; font-weight:700;
    padding:20px; background:#0d0b14cc; z-index:1; }
  #status.on { display:grid; }
  #timer.low { color:#ff8f8f; }
  #alert { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:2; display:none; max-width:92%;
    padding:6px 14px; border-radius:10px; background:#a01c1ce8; color:#fff; font-size:15px; font-weight:700; text-align:center; pointer-events:none; }
  #alert.on { display:block; }
  /* 괴물이 3칸 안에 있으면 지도 테두리가 붉게 깜빡임(방향키에 가려진 구석 대비) */
  #mapbox.danger::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    box-shadow: inset 0 0 0 4px #ff3b3b, inset 0 0 36px #ff3b3b99; animation: blink .5s infinite alternate; }
  @keyframes blink { to { opacity:.25; } }
  #jail { position:absolute; inset:0; z-index:5; display:none; flex-direction:column; gap:14px; overflow-y:auto; touch-action:pan-y;
    padding: max(24px, env(safe-area-inset-top)) 20px 24px; background:#1d0f16f5; }
  #jail.on { display:flex; }
  #jail h2 { margin:0; font-size:24px; } #jailMsg { margin:0; font-size:16px; color:#ffd2d2; }
  #jailQ p { font-size:18px; font-weight:700; line-height:1.5; margin:0 0 12px; }
  #jailQ button { display:block; width:100%; margin-bottom:10px; padding:14px; font-size:17px; text-align:left; border-radius:12px;
    border:2px solid var(--line); background:var(--panel); color:var(--text); }
  canvas { display:block; border-radius:12px; }
  #panel { flex:none; height:200px; padding: 10px 16px max(14px, env(safe-area-inset-bottom)); display:flex;
    align-items:center; justify-content:space-between; background:var(--panel); border-top:1px solid var(--line); }
  #pad { position:relative; width:160px; height:160px; border-radius:50%; background:#2e2740; border:2px solid var(--line); flex:none; }
  #pad span { position:absolute; width:52px; height:52px; display:grid; place-items:center; font-size:22px; color:var(--dim);
    border-radius:12px; background:#3a3150; }
  #pad .u { left:54px; top:4px; } #pad .d { left:54px; bottom:4px; } #pad .l { left:4px; top:54px; } #pad .r { right:4px; top:54px; }
  #pad span.on { background:var(--hot); color:#fff; }
  #team { list-style:none; margin:0; padding:0; font-size:14px; display:flex; flex-direction:column; gap:6px; max-width:45%; }
  #team li { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #team li.off { opacity:.4; }

  /* 가로 화면: 조작판을 지도 아래가 아니라 지도 양옆(왼쪽 아래 방향키, 오른쪽 팀원)에 겹쳐 둔다 */
  body.land #panel { position:absolute; left:0; right:0; bottom:0; height:auto; background:none; border:0; pointer-events:none;
    padding: 0 max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); align-items:flex-end; }
  body.land #pad { pointer-events:auto; width:140px; height:140px; }
  body.land #pad .u { left:44px; } body.land #pad .d { left:44px; } body.land #pad .l, body.land #pad .r { top:44px; }
  body.land #team { max-width:22%; text-shadow:0 1px 3px #000; }
  body.land #pad { opacity:.75; }
  body.land #hud { position:absolute; left:0; right:0; top:0; z-index:2; pointer-events:none; text-shadow:0 1px 3px #000; }
  body.land #hud > * { pointer-events:auto; }
</style>
</head>
<body>

<section id="join" class="screen on">
  <h1>🔦 과학실의 그림자: 보충의 밤</h1>
  <p>선생님이 알려 준 우리 팀 방 코드를 입력하세요.</p>
  <label for="code">방 코드</label>
  <input id="code" class="field" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
  <label for="nick">닉네임 (8자 이내)</label>
  <input id="nick" class="field" maxlength="8" autocomplete="off" placeholder="닉네임">
  <label>캐릭터 고르기</label>
  <div id="avatars"></div>
  <div id="msg" role="alert"></div>
  <button id="go" class="big">입장하기</button>
</section>

<section id="game" class="screen">
  <div id="hud"><span>방 <b id="roomcode"></b> · ⏱ <b id="timer">--:--</b></span><button id="out">나가기</button></div>
  <div id="mapbox"><canvas id="cv"></canvas><div id="alert" role="status" aria-live="polite"></div><div id="status" role="status"></div></div>
  <div id="panel">
    <div id="pad" aria-label="방향키"><span class="u">▲</span><span class="l">◀</span><span class="r">▶</span><span class="d">▼</span></div>
    <ul id="team"></ul>
  </div>
  <div id="jail" role="dialog" aria-label="보충수업실">
    <h2>🔒 보충수업실</h2>
    <p id="jailMsg" role="status"></p>
    <div id="jailQ"></div>
  </div>
</section>

<script type="module">
import * as net from "./net.js";
import { MAP } from "./maps.js";
import { phaseAt, spawnTile, stepToward, nextTarget, patrolStep, sightTiles, hostOf, STEP_MS as MON_STEP_MS, PATROL_STEP_MS, HIDE_WARN_MS, HIDE_MAX_MS, HIDE_COOLDOWN_MS, PLAYER_STEP_MS, CHASE_MS } from "./monsters.js";
import { JAIL_QUESTIONS } from "./questions.js";

const AVATARS = ["🐱","🐶","🐰","🦊","🐼","🐸","🐧","🐻"];
let VIEW_W = 9, VIEW_H = 11; // 세로 9×11칸, 가로 13×7칸(보이는 칸 수를 비슷하게 맞춤)
const STEP_MS = PLAYER_STEP_MS; // 괴물 속도(10% 빠름)의 기준이라 monsters.js 값을 씀
const DIRS = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] };
const start = (() => { for (let y in MAP) { const x = MAP[y].indexOf("S"); if (x >= 0) return { x, y:+y }; } })();
const walkable = (x, y) => { const c = MAP[y]?.[x]; return c && c !== "#" && c !== "D"; };

const $ = id => document.getElementById(id);

// 키보드가 올라오면 화면 높이가 줄어 '가로'로 오인되므로, 화면 비율 대신 기기 방향으로 판정
const checkRotate = () => document.body.classList.toggle("land",
  (screen.orientation?.type ?? "").startsWith("landscape") || Math.abs(window.orientation ?? 0) === 90);
addEventListener("resize", checkRotate); addEventListener("orientationchange", checkRotate); checkRotate();
let avatar = 0, me = null, mates = {}, dir = null, lastStep = 0, meta = { state: "wait" };
let mon = null, monR = null, grace = 0, quiz = null; // mon: 서버의 괴물 {n,x,y}, quiz: { i: 문제 번호, lock: 다시 풀 수 있는 시각 }
let drawKey = "", hideMs = 0, lastT = 0, mStep = 0, mTarget = null, hideBlockUntil = 0, blockedMsgUntil = 0;

// ── 입장 ──
AVATARS.forEach((a, i) => {
  const b = document.createElement("button");
  b.textContent = a; b.setAttribute("aria-label", "캐릭터 " + (i + 1));
  b.onclick = () => { avatar = i; [...$("avatars").children].forEach((c, j) => c.classList.toggle("sel", j === i)); };
  $("avatars").append(b);
});
$("avatars").children[0].classList.add("sel");

let saved = null;
try { saved = JSON.parse(localStorage.getItem("escape-profile")); } catch {}
if (saved) { $("code").value = saved.code || ""; $("nick").value = saved.nick; $("avatars").children[saved.avatar]?.click(); }
try { $("msg").textContent = sessionStorage.getItem("escape-msg") || ""; sessionStorage.removeItem("escape-msg"); } catch {}
const ERRORS = { NOCODE: "없는 방 코드예요. 선생님께 다시 확인하세요.", FULL: "이 팀은 자리가 다 찼어요. 선생님께 말씀하세요.",
  KICKED: "선생님이 이 기기를 내보냈어요. 선생님께 말씀하세요." };

$("go").onclick = async () => {
  const code = $("code").value.trim().toUpperCase(), nick = $("nick").value.trim();
  if (!/^[A-Z0-9]{4,6}$/.test(code)) return $("msg").textContent = "방 코드는 영어·숫자 4~6자예요.";
  if (!nick) return $("msg").textContent = "닉네임을 입력하세요.";
  $("go").disabled = true; $("msg").textContent = "접속 중…";
  try {
    const { uid, last } = await net.join(code, nick, avatar);
    try { localStorage.setItem("escape-profile", JSON.stringify({ code, nick, avatar })); } catch {}
    me = { uid, code, nick, avatar, ...(last && walkable(last.x, last.y) ? last : start), d: "d" };
    me.rx = me.x; me.ry = me.y; me.jail ||= 0;
    // 새로고침으로 숨기 제한·재사용 대기를 초기화하지 못하게 기기에 저장해 둔 값을 되살림
    try { ({ hideMs = 0, hideBlockUntil = 0 } = JSON.parse(localStorage.getItem("escape-hide-" + uid + code)) || {}); } catch {}
    net.move(me.x, me.y, me.d, me.jail);
    net.onTeam(t => { mates = t; drawTeam(); });
    net.onMeta(m => { meta = m; });
    net.onMonster(m => { mon = m; });
    net.onKicked(() => {
      try { sessionStorage.setItem("escape-msg", "선생님이 내보냈거나 반이 종료됐어요.");
        localStorage.setItem("escape-profile", JSON.stringify({ nick, avatar })); } catch {}
      location.reload();
    });
    setInterval(tick, 500); tick();
    $("roomcode").textContent = code;
    $("join").classList.remove("on"); $("game").classList.add("on");
    resize(); requestAnimationFrame(loop);
  } catch (e) {
    $("msg").textContent = ERRORS[e.message] || "접속에 실패했어요. 인터넷 연결을 확인하세요."; console.error(e);
  } finally { $("go").disabled = false; }
};
$("out").onclick = async () => { await net.leave(); location.reload(); };

// 남은 시간과 상태 안내. 움직일 수 있는지도 여기서 정한다.
const left = () => meta.state === "play" ? meta.endsAt - net.serverNow() : meta.remain ?? 0;
const playing = () => meta.state === "play" && left() > 0;
function tick() {
  const ms = Math.max(0, left()), sec = Math.ceil(ms / 1000);
  $("timer").textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  $("timer").classList.toggle("low", playing() && sec <= 60);
  const text = playing() ? "" : meta.state === "wait" ? "⏳ 선생님이 시작하면 움직일 수 있어요"
    : meta.state === "pause" ? "⏸ 잠깐 멈춤" : "🏁 게임 끝!";
  $("status").textContent = text; $("status").classList.toggle("on", !!text);
  jailTick();
  try { localStorage.setItem("escape-hide-" + me.uid + me.code, JSON.stringify({ hideMs, hideBlockUntil })); } catch {}
}

// ── 보충수업실: 대기 시간이 끝나면 학습지 문제. 맞히면 시작점으로, 틀리면 10초 뒤 새 문제 ──
function jailTick() {
  $("jail").classList.toggle("on", me.jail > 0);
  if (!me.jail) return;
  const now = net.serverNow(), wait = Math.ceil((me.jail - now) / 1000);
  if (wait > 0) { $("jailMsg").textContent = `괴물 선생님에게 잡혔다! ${wait}초 뒤에 탈출 문제가 나와요.`; $("jailQ").replaceChildren(); return; }
  if (quiz?.lock > now) { $("jailMsg").textContent = `아쉬워요! ${Math.ceil((quiz.lock - now) / 1000)}초 뒤에 새 문제가 나와요.`; return; }
  if (quiz && !quiz.lock) return; // 지금 푸는 중
  let i; do i = Math.floor(Math.random() * JAIL_QUESTIONS.length); while (JAIL_QUESTIONS.length > 1 && i === quiz?.i);
  quiz = { i, lock: 0 };
  const Q = JAIL_QUESTIONS[i];
  $("jailMsg").textContent = "문제를 맞히면 시작점으로 탈출!";
  const p = document.createElement("p"); p.textContent = Q.q;
  const order = Q.c.map((_, k) => k); // 보기 순서를 매번 섞음(정답 위치를 외우지 못하게)
  for (let k = order.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [order[k], order[r]] = [order[r], order[k]]; }
  $("jailQ").replaceChildren(p, ...order.map(k => {
    const b = document.createElement("button"); b.textContent = Q.c[k];
    b.onclick = () => k === Q.a ? escapeJail() : (quiz.lock = net.serverNow() + 10000, $("jailQ").replaceChildren(), jailTick());
    return b;
  }));
}
function escapeJail() {
  Object.assign(me, start, { jail: 0 }); me.rx = me.x; me.ry = me.y;
  grace = net.serverNow() + 3000; quiz = null; // 풀려나자마자 다시 잡히지 않게 3초 보호
  net.move(me.x, me.y, me.d, 0); jailTick();
}

let teamSig = "";
function drawTeam() { // 팀원이 한 칸 움직일 때마다 불리므로, 이름·접속·보충실 상태가 바뀔 때만 다시 그림
  const sig = JSON.stringify(Object.entries(mates).map(([id, m]) => [id, m.nick, m.avatar, m.online, !!m.jail]));
  if (sig === teamSig) return; teamSig = sig;
  $("team").replaceChildren(...Object.entries(mates).map(([id, m]) => {
    const li = document.createElement("li");
    li.textContent = `${AVATARS[m.avatar] ?? "❔"} ${m.nick}${id === me.uid ? " (나)" : ""}${m.jail ? " 🔒" : ""}`;
    if (!m.online) li.classList.add("off");
    return li;
  }));
}

// ── 방향키: 원판 하나에서 손가락 각도로 방향 판정 → 버튼 사이로 미끄러져도 끊기지 않음 ──
const pad = $("pad");
function padDir(e) {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < 14) return null; // 가운데는 정지
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u");
}
function setDir(d) {
  dir = d;
  for (const s of pad.children) s.classList.toggle("on", s.classList.contains(d));
}
pad.addEventListener("pointerdown", e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); setDir(padDir(e)); });
pad.addEventListener("pointermove", e => { if (pad.hasPointerCapture(e.pointerId)) setDir(padDir(e)); });
for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) pad.addEventListener(t, () => setDir(null));
// iOS: 두 손가락 확대·길게 누르기 메뉴 차단
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (!e.target.closest("#join, #jail")) e.preventDefault(); }, { passive:false });
document.addEventListener("contextmenu", e => e.preventDefault());
// PC 테스트용 키보드
const KEYS = { ArrowUp:"u", ArrowDown:"d", ArrowLeft:"l", ArrowRight:"r" };
addEventListener("keydown", e => { if (KEYS[e.key] && me) { e.preventDefault(); setDir(KEYS[e.key]); } });
addEventListener("keyup", e => { if (KEYS[e.key] === dir) setDir(null); });

// ── 화면 그리기 ──
const cv = $("cv"), ctx = cv.getContext("2d");
let T = 32;
function resize() {
  const box = $("mapbox").getBoundingClientRect();
  if (box.width < 50 || box.height < 50) return; // 회전 도중의 임시 크기는 무시(0이 되면 지도가 사라짐)
  const land = document.body.classList.contains("land");
  VIEW_W = land ? 13 : 9; VIEW_H = land ? 7 : 11;
  T = Math.floor(Math.min((box.width - 16) / VIEW_W, (box.height - 8) / VIEW_H));
  const dpr = devicePixelRatio || 1;
  cv.style.width = T * VIEW_W + "px"; cv.style.height = T * VIEW_H + "px";
  cv.width = T * VIEW_W * dpr; cv.height = T * VIEW_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
// window resize는 회전 직후 크기가 덜 바뀐 상태에서 오기도 해서, 지도 칸의 실제 크기 변화를 지켜본다
new ResizeObserver(() => { if (me) resize(); }).observe($("mapbox"));

// 사물함은 한 칸에 한 명만
const lockerTaken = (x, y) => MAP[y][x] === "H" && Object.entries(mates).some(([id, m]) => id !== me.uid && m.online && !m.jail && m.x === x && m.y === y);

function caughtNow() {
  me.jail = net.serverNow() + (meta.jailSec ?? 60) * 1000; hideMs = 0; setDir(null);
  net.move(me.x, me.y, me.d, me.jail); jailTick();
}

// 방장 기기만: 등장 20초 동안 괴물을 움직여 서버에 올린다.
// 6칸 안에서 알아챈 학생은 학생보다 10% 빠르게 쫓고, 쫓을 학생이 없으면 느리게 순찰한다.
function runMonster(now, ph) {
  if (!playing() || ph.phase !== "chase" || now - mStep < (mon?.tid ? MON_STEP_MS : PATROL_STEP_MS)) return;
  const t = net.serverNow(), cur = mon?.n === ph.n ? mon : null;
  if (hostOf(mates, cur, t, t - (CHASE_MS - ph.left)) !== me.uid) return;
  mStep = now;
  const players = Object.entries(mates).filter(([, m]) => m.online && m.x != null)
    .map(([id, m]) => id === me.uid ? { id, x: me.x, y: me.y, jail: me.jail } : { id, x: m.x, y: m.y, jail: m.jail });
  if (mon?.n !== ph.n) { // 이번 등장의 첫 순간: 학생들에게서 5칸 이상 떨어진 곳에 나타남
    mon = { n: ph.n, ...spawnTile(MAP, players.filter(p => !p.jail), meta.seed ?? 1, ph.n), by: me.uid, t, tid: null, h: 0 };
    mTarget = null; return net.setMonster(mon);
  }
  // 방장이 바뀌었으면 서버에 남은 표적(tid)을 이어받는다
  if (!mTarget && mon.tid) mTarget = { id: mon.tid, x: mon.x, y: mon.y, at: 0 };
  mTarget = nextTarget(MAP, mon, players, mTarget, now);
  const step = mTarget ? { ...stepToward(MAP, mon, mTarget), h: mon.h ?? 0 } : patrolStep(MAP, mon, mon.h ?? 0);
  mon = { n: ph.n, ...step, by: me.uid, t, tid: mTarget?.id ?? null }; // 제자리여도 올려서 '살아 있음'을 알림
  net.setMonster(mon);
}

// 화면 위치(rx, ry)를 목표 칸(x, y)으로 한 프레임에 최대 v칸씩 옮김. 2칸 넘게 벌어지면(순간이동·재접속) 바로 그 자리로
function glide(o, x, y, v) {
  if (o.rx == null || Math.abs(o.rx - x) + Math.abs(o.ry - y) > 2) return [x, y];
  const step = (r, t) => Math.abs(t - r) <= v ? t : r + Math.sign(t - r) * v;
  return [step(o.rx, x), step(o.ry, y)];
}

function loop(now) {
  const ph = phaseAt(net.gameMs(meta), meta.seed ?? 1);
  const active = ph.phase === "chase" && mon?.n === ph.n ? mon : null; // 이번 등장의 괴물만 보임
  if (dir && playing() && !me.jail && now - lastStep >= STEP_MS) {
    // 계속 누르고 있으면 정확히 140ms 간격으로 걷게(화면 주기 때문에 생기는 미세한 멈칫거림 방지)
    lastStep = now - lastStep < STEP_MS * 2 ? lastStep + STEP_MS : now; me.d = dir;
    const [dx, dy] = DIRS[dir], nx = me.x + dx, ny = me.y + dy;
    const wasHidden = MAP[me.y][me.x] === "H", intoLocker = MAP[ny]?.[nx] === "H";
    if (intoLocker && net.serverNow() < hideBlockUntil) blockedMsgUntil = net.serverNow() + 1500; // 나온 지 15초가 안 됨
    else if (walkable(nx, ny) && !lockerTaken(nx, ny)) {
      me.x = nx; me.y = ny; net.move(me.x, me.y, me.d);
      if (wasHidden && !intoLocker) hideBlockUntil = net.serverNow() + HIDE_COOLDOWN_MS;
    }
  }
  runMonster(now, ph);
  // 숨기 제한: 사물함 안에서는 시간이 쌓이고, 밖에서는 1초에 1초씩 줄어듦. 60초면 들킴
  const dt = lastT ? Math.min(now - lastT, 250) : 0; lastT = now;
  const hidden = MAP[me.y][me.x] === "H";
  if (playing() && !me.jail) {
    hideMs = Math.max(0, hideMs + (hidden ? dt : -dt));
    if (hidden && hideMs >= HIDE_MAX_MS) caughtNow();
    else if (!hidden && net.serverNow() > grace && active?.x === me.x && active?.y === me.y) caughtNow();
  }
  const near = active && Math.abs(active.x - me.x) + Math.abs(active.y - me.y) <= 3;
  $("mapbox").classList.toggle("danger", playing() && !me.jail && !!near);
  const alert = !playing() || me.jail ? ""
    : hidden && hideMs >= HIDE_WARN_MS ? `…발소리가 가까워진다. ${Math.ceil((HIDE_MAX_MS - hideMs) / 1000)}초 뒤 들킬 것 같아!`
    : net.serverNow() < blockedMsgUntil ? `🗄️ ${Math.ceil((hideBlockUntil - net.serverNow()) / 1000)}초 뒤에 다시 숨을 수 있어요`
    : ph.phase === "warn" ? "…누가 복도에 있니? (보충쌤이 곧 나타나요!)"
    : active?.tid === me.uid ? `😱 들켰다! 보충쌤이 나를 쫓아온다 (${Math.ceil(ph.left / 1000)}초)`
    : active ? `👨‍🔬 보충쌤 ${active.tid ? "추격 중" : "순찰 중"}… ${Math.ceil(ph.left / 1000)}초 버티기${hidden ? " · 🫣 숨는 중" : ""}`
    : hidden ? `🫣 사물함에 숨는 중 (${Math.floor(hideMs / 1000)}초 / 60초)` : "";
  if ($("alert").textContent !== alert) $("alert").textContent = alert;
  $("alert").classList.toggle("on", !!alert);
  // 화면 위치는 일정한 속도로 따라감(한 칸 = 한 걸음 시간) → 계속 걸으면 끊김 없이 미끄러지듯 이동
  [me.rx, me.ry] = glide(me, me.x, me.y, dt / STEP_MS);
  // 괴물은 부드럽게 움직이되, 새로 나타나면 바로 그 자리로
  if (!active) monR = null;
  else { monR ??= { rx: active.x, ry: active.y }; [monR.rx, monR.ry] = glide(monR, active.x, active.y, dt / (active.tid ? MON_STEP_MS : PATROL_STEP_MS) * 1.1);
    monR.x = monR.rx; monR.y = monR.ry; }
  for (const id in mates) {
    const m = mates[id]; if (id === me.uid || m.x == null) continue;
    [m.rx, m.ry] = glide(m, m.x, m.y, dt / STEP_MS * 1.2); // 통신 지연분을 따라잡도록 조금 빠르게
  }
  // 화면에 보이는 것이 바뀔 때만 다시 그림(가만히 있을 때 배터리·발열 절약)
  const key = [me.rx, me.ry, monR?.x, monR?.y, mon?.tid, T, VIEW_W, ...Object.values(mates).flatMap(m => [m.rx, m.ry, m.online, m.jail, m.nick])]
    .map(v => typeof v === "number" ? v.toFixed(2) : v).join();
  if (key !== drawKey) { drawKey = key; draw(); }
  requestAnimationFrame(loop);
}

function draw() {
  const W = MAP[0].length, H = MAP.length;
  const cx = Math.max(0, Math.min(W - VIEW_W, me.rx - (VIEW_W - 1) / 2));
  const cy = Math.max(0, Math.min(H - VIEW_H, me.ry - (VIEW_H - 1) / 2));
  ctx.fillStyle = "#0d0b14"; ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = Math.floor(cy); y < Math.min(H, cy + VIEW_H + 1); y++)
    for (let x = Math.floor(cx); x < Math.min(W, cx + VIEW_W + 1); x++) {
      const c = MAP[y][x], px = (x - cx) * T, py = (y - cy) * T;
      ctx.fillStyle = c === "#" ? "#3a3150" : c === "D" ? "#8a4b2a" : c === "E" ? "#2f6b4f" : c === "H" ? "#4a3b2c" : (x + y) % 2 ? "#2a2438" : "#2e283d";
      ctx.fillRect(px, py, T + 0.5, T + 0.5);
      if ("DEH".includes(c)) { ctx.font = `${T * 0.6}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(c === "D" ? "🔒" : c === "E" ? "🚪" : "🗄️", px + T / 2, py + T / 2); }
    }
  if (monR && !mon.tid) { // 순찰 중: 괴물이 알아챌 수 있는 칸(걸어서 6칸, 벽에 막히면 제외)을 반투명 빨강으로
    ctx.fillStyle = "rgba(255, 45, 45, 0.2)";
    for (const k of sightTiles(MAP, mon).keys()) {
      const [x, y] = k.split(",").map(Number);
      ctx.fillRect((x - cx) * T, (y - cy) * T, T, T);
    }
  }
  if (monR) {
    const px = (monR.x - cx) * T + T / 2, py = (monR.y - cy) * T + T / 2;
    ctx.beginPath(); ctx.arc(px, py, T * 0.48, 0, Math.PI * 2); ctx.fillStyle = mon?.tid ? "#c0262690" : "#6a4a9a90"; ctx.fill(); // 추격 빨강, 순찰 보라
    ctx.font = `${T * 0.72}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
    ctx.fillText("👨‍🔬", px, py + 1);
  }
  const others = Object.entries(mates).filter(([id, m]) => id !== me.uid && m.online && !m.jail && m.rx != null);
  for (const [, m] of others) drawChar(m.rx, m.ry, m.avatar, m.nick, cx, cy, false);
  drawChar(me.rx, me.ry, me.avatar, me.nick, cx, cy, true);
}
function drawChar(x, y, av, nick, cx, cy, mine) {
  const px = (x - cx) * T + T / 2, py = (y - cy) * T + T / 2;
  ctx.beginPath(); ctx.arc(px, py, T * 0.46, 0, Math.PI * 2);
  ctx.fillStyle = mine ? "#ff7a3d55" : "#ffffff22"; ctx.fill();
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.font = `${T * 0.7}px sans-serif`; ctx.fillText(AVATARS[av] ?? "❔", px, py + 1);
  ctx.font = `bold ${Math.max(10, T * 0.32)}px sans-serif`;
  ctx.fillText(nick, px, py - T * 0.62 < 8 ? py + T * 0.62 : py - T * 0.62); // 맨 윗줄이면 이름표를 아래에
}
</script>
