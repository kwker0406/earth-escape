<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>과학실의 그림자: 보충의 밤</title>

<style>
  :root { --bg:#16131f; --panel:#221d30; --line:#3a3150; --text:#f3eefc; --dim:#a79cc0; --hot:#ff7a3d; --ok:#5ad19a; }
  /* 화면이 끌려가지 않게: 고정 + 스크롤·확대·당겨서 새로고침·글자 선택 차단 */
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  input, button { touch-action:manipulation; font:inherit; }
  input { user-select:text; -webkit-user-select:text; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }

  /* 입장 화면 */
  #join { padding: max(24px, env(safe-area-inset-top)) 20px 24px; gap:14px; overflow-y:auto; touch-action:pan-y; }
  #join h1 { margin:8px 0 0; font-size:24px; } #join p { margin:0; color:var(--dim); font-size:14px; }
  label { font-size:14px; color:var(--dim); }
  .field { width:100%; box-sizing:border-box; padding:14px; font-size:18px; border-radius:12px; border:2px solid var(--line);
    background:var(--panel); color:var(--text); }
  #code { text-transform:uppercase; letter-spacing:6px; text-align:center; font-weight:700; }
  #avatars { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  #avatars button { aspect-ratio:1; font-size:11px; padding:2px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink,#fff); border-radius:14px; border:3px solid var(--line); background:var(--panel); }
  #avatars button.sel { border-color:var(--hot); background:#3a2a2a; }
  .big { padding:16px; font-size:18px; font-weight:700; border:0; border-radius:14px; background:var(--hot); color:#fff; }
  #msg { min-height:20px; color:#ff8f8f; font-size:14px; }

  /* 게임 화면: 위쪽 지도, 아래쪽 조작판 */
  #game { height:100dvh; }
  #hud { display:flex; justify-content:space-between; align-items:center; padding: max(8px, env(safe-area-inset-top)) 14px 8px;
    font-size:14px; color:var(--dim); }
  #hud b { color:var(--text); letter-spacing:2px; }
  #hud button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:4px 8px; }
  #mapbox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  #status { position:absolute; inset:0; display:none; place-items:center; text-align:center; font-size:22px; font-weight:700;
    padding:20px; background:#0d0b14cc; z-index:1; }
  #status.on { display:grid; }
  #timer.low { color:#ff8f8f; }
  #alert { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:2; display:none; max-width:92%;
    padding:6px 14px; border-radius:10px; background:#a01c1ce8; color:#fff; font-size:15px; font-weight:700; text-align:center; pointer-events:none; }
  #alert.on { display:block; white-space:pre-line; }
  #alert:not(.mon) { background:#2a2440e8; } /* 보충쌤이 없을 때 알림은 차분한 색, 보충쌤 시간엔 빨강 */
  /* 괴물이 3칸 안에 있으면 지도 테두리가 붉게 깜빡임(방향키에 가려진 구석 대비) */
  #mapbox.danger::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    box-shadow: inset 0 0 0 4px #ff3b3b, inset 0 0 36px #ff3b3b99; animation: blink .5s infinite alternate; }
  @keyframes blink { to { opacity:.25; } }
  #jail { position:absolute; inset:0; z-index:5; display:none; flex-direction:column; gap:14px; overflow-y:auto; touch-action:pan-y;
    padding: max(24px, env(safe-area-inset-top)) 20px 24px; background:#1d0f16f5; }
  #jail.on { display:flex; }
  #jail h2 { margin:0; font-size:24px; } #jailMsg { margin:0; font-size:16px; color:#ffd2d2; }
  #jailQ p { font-size:18px; font-weight:700; line-height:1.5; margin:0 0 12px; }
  #jailQ button { display:block; width:100%; margin-bottom:10px; padding:14px; font-size:17px; text-align:left; border-radius:12px;
    border:2px solid var(--line); background:var(--panel); color:var(--text); }
  canvas { display:block; border-radius:12px; }
  #panel { flex:none; height:200px; padding: 10px 16px max(14px, env(safe-area-inset-bottom)); display:flex;
    align-items:center; justify-content:space-between; background:var(--panel); border-top:1px solid var(--line); }
  #pad { position:relative; width:160px; height:160px; border-radius:50%; background:#2e2740; border:2px solid var(--line); flex:none; }
  #pad span { position:absolute; width:52px; height:52px; display:grid; place-items:center; font-size:22px; color:var(--dim);
    border-radius:12px; background:#3a3150; }
  #pad .u { left:54px; top:4px; } #pad .d { left:54px; bottom:4px; } #pad .l { left:4px; top:54px; } #pad .r { right:4px; top:54px; }
  #pad span.on { background:var(--hot); color:#fff; }
  #team { list-style:none; margin:0; padding:0; font-size:14px; display:flex; flex-direction:column; gap:6px; max-width:45%; }
  #team li span:first-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #team li.off { opacity:.4; }

  /* 세로·가로 모두: 지도가 화면 전체. 그 위에 왼쪽 아래 방향키(반투명), 오른쪽 아래 조사·단서, 오른쪽 위 접속자 명단, 왼쪽 위 층·시간 */
  #mapbox { position:absolute; inset:0; overflow:hidden; }
  canvas { border-radius:0; }
  #panel { position:absolute; inset:0; height:auto; background:none; border:0; pointer-events:none; padding:0; }
  #side { display:contents; }
  #pad { position:absolute; left:max(16px, env(safe-area-inset-left)); bottom:max(12px, env(safe-area-inset-bottom));
    pointer-events:auto; width:140px; height:140px; opacity:.55; }
  #pad .u { left:44px; } #pad .d { left:44px; } #pad .l, #pad .r { top:44px; }
  #acts { position:absolute; right:max(16px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom)); pointer-events:auto; }
  #team { position:absolute; right:max(12px, env(safe-area-inset-right)); top:max(8px, env(safe-area-inset-top)); max-width:34%;
    padding:6px 10px; border-radius:10px; background:#0d0b14aa; text-shadow:0 1px 2px #000; gap:3px; font-size:13px; }
  #hud { position:absolute; left:0; top:0; z-index:2; justify-content:flex-start; gap:10px; pointer-events:none;
    padding: max(8px, env(safe-area-inset-top)) 14px 8px max(14px, env(safe-area-inset-left)); text-shadow:0 1px 3px #000; }
  #hud > * { pointer-events:auto; }
  #alert { top:44px; }
  body:not(.land) #team { max-width:46%; }
  body:not(.land) #alert { left:max(12px, env(safe-area-inset-left)); transform:none; max-width:48%; top:52px; font-size:14px; } /* 세로: 명단(오른쪽 위)과 안 겹치게 왼쪽 */
  body:not(.land) #pad { width:150px; height:150px; } body:not(.land) #pad .u, body:not(.land) #pad .d { left:49px; } body:not(.land) #pad .l, body:not(.land) #pad .r { top:49px; }
  #team li { display:flex; gap:6px; justify-content:space-between; }
  #team li .st { flex:none; }
  /* 조사·단서 버튼과 퍼즐·단서·엔딩 창 */
  .dials { display:flex; gap:8px; justify-content:center; }
  .wheel { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .wheel button { width:56px; padding:8px 0; font-size:18px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  .dial { width:56px; height:56px; font-size:28px; font-weight:700; text-align:center; border-radius:10px; border:2px solid var(--hot); background:#0d0b14; color:#fff; }
  .drop { margin:6px 6px 0 0; padding:8px 10px; font-size:14px; border:0; border-radius:10px; background:#3a5f8a; color:#fff; }
  #side { display:flex; flex-direction:column; gap:8px; align-items:flex-end; max-width:48%; }
  #acts { display:flex; gap:6px; }
  #acts button { padding:10px 12px; font-size:15px; font-weight:700; border-radius:12px; border:0; background:var(--hot); color:#fff; }
  #acts button:disabled { background:var(--line); color:var(--dim); }
  #acts #bagBtn { background:#3a5f8a; }
  body.land #acts { pointer-events:auto; }
  .modal { position:absolute; inset:0; z-index:6; display:none; flex-direction:column; gap:12px; overflow-y:auto; touch-action:pan-y;
    padding: max(20px, env(safe-area-inset-top)) 18px 24px; background:#16131ff5; }
  .modal.on { display:flex; }
  .modal h2 { margin:0; font-size:21px; } .modal .sub { margin:0; color:var(--dim); font-size:14px; }
  .modal .ask { font-size:17px; font-weight:700; line-height:1.5; margin:0; }
  /* 스크롤해도 닫기 버튼이 맨 위에 남게(폰 노치 아래로) */
  .modal > .close:first-child { position:sticky; top:env(safe-area-inset-top); z-index:3; background:#16131f; box-shadow:0 4px 10px #16131f; }
  .modal > .bar { position:sticky; top:0; z-index:3; display:flex; gap:8px; align-items:center; flex:none;
    margin:calc(-1 * max(20px, env(safe-area-inset-top))) -18px 0; padding:max(10px, env(safe-area-inset-top)) 18px 10px; background:#16131ff8; border-bottom:1px solid var(--line); }
  .modal > .bar h2 { flex:1; font-size:19px; } .modal > .bar .close { align-self:auto; }
  .modal h3 { margin:6px 0 0; font-size:17px; }
  .modal .tab { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:15px; font-weight:700; }
  .modal .tab.on { border-color:var(--hot); background:#3a2a2a; } .modal .tab:disabled { opacity:.4; }
  .modal .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .modal .mmap { overflow:auto; touch-action:pan-x pan-y; border-radius:10px; background:#0d0b14; padding:8px; align-self:center; max-width:100%; }
  .pzc { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; flex:none; }
  .pzc .card { margin-top:6px; }
  .pzc summary { cursor:pointer; font-size:15px; line-height:1.5; } .pzc summary span { color:var(--dim); font-size:13px; }
  .pzc.done { opacity:.6; } .pzc .card { background:#2b2440; }
  .modal .close { align-self:flex-end; background:none; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:8px 14px; font-size:15px; }
  .modal .opt { display:block; width:100%; padding:13px; font-size:16px; text-align:left; border-radius:12px; border:2px solid var(--line); background:var(--panel); color:var(--text); }
  .modal .opt.sel { border-color:var(--hot); }
  .modal .opt.done { opacity:.45; }
  .levers { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .lever { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:12px; border:2px solid var(--line); background:#0d0b14; color:var(--text); }
  .lever .knob { width:44px; height:64px; display:grid; border-radius:10px; background:linear-gradient(#3a3150, #221d30); font-size:24px; }
  .lever.up .knob { place-items:start center; color:#ffd84a; } .lever.down .knob { place-items:end center; color:#7fc4ff; }
  .lever small { font-size:13px; color:var(--dim); }
  .wires { display:grid; grid-template-columns:36px repeat(4, 1fr) 36px; gap:6px; align-items:center; justify-items:center; font-size:26px; }
  .wire { width:100%; aspect-ratio:1; font-size:40px; line-height:1; border-radius:10px; border:2px solid var(--line); background:#0d0b14; color:#6a6280; }
  .wire { -webkit-text-stroke:3px currentColor; } .wire.on { color:#ffd84a; border-color:#8a7a2a; }
  .bulb.off { opacity:.3; filter:grayscale(1); }
  .pic { display:grid; grid-template-columns:repeat(3, 1fr); gap:3px; max-width:330px; width:100%; align-self:center; }
  .piece { aspect-ratio:1; border:0; border-radius:4px; background-size:cover; }
  .piece.sel { outline:4px solid var(--hot); outline-offset:-4px; }
  .seqshow { min-height:26px; font-size:20px; text-align:center; margin:0; color:#ffd84a; }
  .modal .row2 { display:flex; gap:8px; }
  .modal .row2 .field { flex:1; }
  .modal .go { padding:13px 18px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--hot); color:#fff; }
  .modal .cols { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .modal .fb { min-height:22px; font-weight:700; } .fb.ok { color:var(--ok); } .fb.no { color:#ff8f8f; }
  .modal .hint { color:#ffd98a; font-size:15px; margin:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:15px; line-height:1.5; }
  .card small { color:var(--dim); display:block; }
  /* 칠판 손글씨: 개구(Gaegu) 굵은체를 게임 폴더에 함께 둠(fonts/, 자주 쓰는 한글 2350자만 → 약 470KB, 칠판을 열 때 받음). 글꼴 저작권: fonts/Gaegu-OFL.txt */
  @font-face { font-family:"Gaegu"; src:url("fonts/gaegu-chalk.woff2") format("woff2"); font-weight:700; font-display:swap; }
  .board { background:#1f3d2c; border:10px solid #7a5230; border-bottom-width:16px; border-radius:6px; padding:14px 18px; min-height:170px;
    box-shadow: inset 0 0 40px #000a, 0 6px 14px #0008; color:#f2f6f0; font-family:"Gaegu","Chalkboard SE","Comic Sans MS",cursive; font-weight:700; font-size:25px; line-height:1.45; letter-spacing:.5px;
    text-shadow: 0 0 1px #fff8, 1px 1px 0 #ffffff22, 0 0 6px #ffffff33; }  /* 분필 번짐: 살짝만(가독성 우선) */
  .board p { margin:0 0 8px; transform-origin:left center; word-break:keep-all; } /* 낱말 중간에서 줄 바꾸지 않음 */
  .board p:nth-child(1) { font-size:19px; opacity:.8; transform:rotate(-.6deg); }
  .board p:nth-child(2) { transform:rotate(.5deg); text-decoration:underline; text-decoration-color:#ffffff66; text-underline-offset:5px; }
  .board p:nth-child(3) { transform:rotate(-.8deg) translateX(6px); }
  .board .clue { color:#ffe27a; font-size:27px; transform:rotate(.4deg); text-shadow: 0 0 1px #ffe27a99, 0 0 7px #ffe27a44; }
  #end { background:#0f1a14f5; text-align:center; align-items:center; justify-content:center; }
</style>
</head>
<body>

<section id="join" class="screen on">
  <h1>🔦 과학실의 그림자: 보충의 밤</h1>
  <p>선생님이 알려 준 우리 팀 방 코드를 입력하세요.</p>
  <label for="code">방 코드</label>
  <input id="code" class="field" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
  <label for="nick">닉네임 (8자 이내)</label>
  <input id="nick" class="field" maxlength="8" autocomplete="off" placeholder="닉네임">
  <label>캐릭터 고르기</label>
  <div id="avatars"></div>
  <div id="msg" role="alert"></div>
  <button id="go" class="big">입장하기</button>
  <button id="replay" style="background:none; border:0; color:var(--dim); font-size:14px; text-decoration:underline;">📖 이야기·연습 다시 보기</button>
</section>

<section id="game" class="screen">
  <div id="hud"><span><b id="floorName"></b> · ⏱ <b id="timer">--:--</b></span><span><button id="snd" aria-label="소리 켜기·끄기">🔊</button> <button id="out">나가기</button></span></div>
  <div id="mapbox"><canvas id="cv"></canvas><div id="alert" role="status" aria-live="polite"></div><div id="status" role="status"></div></div>
  <div id="panel">
    <div id="pad" aria-label="방향키"><span class="u">▲</span><span class="l">◀</span><span class="r">▶</span><span class="d">▼</span></div>
    <div id="side">
      <div id="acts"><button id="actBtn" disabled>🔍 조사</button><button id="bagBtn">🎒 단서</button></div>
      <ul id="team"></ul>
    </div>
  </div>
  <div id="jail" role="dialog" aria-label="보충수업실">
    <h2>🔒 보충수업실</h2>
    <p id="jailMsg" role="status"></p>
    <p class="sub">팀원이 보충실 문(🚪) 앞에서 '🔓 구출'을 누르면 바로 나가요.</p>
    <div id="jailQ"></div>
  </div>
  <div id="pz" class="modal" role="dialog" aria-label="퍼즐"></div>
  <div id="bag" class="modal" role="dialog" aria-label="단서 가방"></div>
  <div id="end" class="modal" role="dialog" aria-label="탈출 성공"></div>
</section>

<script type="module">
import * as net from "./net.js";
import { MAPS, ROOMS } from "./maps.js";
import { phaseAt, spawnTile, stepToward, nextTarget, patrolStep, sightTiles, hostOf, STEP_MS as MON_STEP_MS, PATROL_STEP_MS,
  HIDE_WARN_MS, HIDE_MAX_MS, HIDE_COOLDOWN_MS, PLAYER_STEP_MS, CHASE_MS, SEEK_DIST, seekStep, doorWait, LOOK_MS } from "./monsters.js";
import { JAIL_QUESTIONS } from "./questions.js";
import { CHARS, sprite } from "./sprites.js";
import { drawTile, statue } from "./tiles.js";
import { startIntro, playStory, introDone, resetIntro } from "./intro.js";
import { initAudio, setMode, toggleMute, isMuted } from "./audio.js";
import { buildPuzzles, check, clueSpots, clueOwner, dropSpot, scatter, miniGameOf, FLOOR_NAMES, MONSTER_FLOORS, ROLL } from "./puzzles.js";
import * as mini from "./minigames.js";

const AVATARS = CHARS.map(c => c.emoji); // 글자 목록용(팀 목록·결과)
let VIEW_W = 10, VIEW_H = 12; // resize()가 화면에 맞춰 다시 정함: 세로는 가로 10칸, 가로는 세로 8칸 기준
const STEP_MS = PLAYER_STEP_MS; // 괴물 속도(10% 빠름)의 기준이라 monsters.js 값을 씀
const DIRS = { u:[0,-1], d:[0,1], l:[-1,0], r:[1,0] };
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const find = (map, ch) => { for (let y = 0; y < map.length; y++) { const x = map[y].indexOf(ch); if (x >= 0) return { x, y }; } };
const STAIRS = "CKRVWX", LOCKS = "abc"; // 올라가는 계단 C 중앙 K 모서리 R 우측, 내려가는 계단 V·W·X(같은 순서) / 열쇠 문 a·b·c
const zoneKind = ch => "CKR".includes(ch) ? "up" : "down";
const ZONE_COLOR = { up: "rgba(150, 235, 160, 0.2)", down: "rgba(130, 190, 255, 0.24)" };
const PAIR = { C: "V", V: "C", K: "W", W: "K", R: "X", X: "R" }; // 같은 계단실의 위·아래 계단
// 층에 들어설 때 서는 칸: 타고 온 계단(엘리베이터)과 같은 것 옆. 그 층에 없으면 모서리 계단, 처음엔 현관(S)
function arrival(map, via) {
  const s = (via && (find(map, via) || find(map, PAIR[via]))) || find(map, "S") || find(map, "K") || find(map, "W");
  if (map[s.y][s.x] === "S") return s;
  for (const [dx, dy] of D4) if (map[s.y + dy]?.[s.x + dx] === ".") return { x: s.x + dx, y: s.y + dy };
  return s;
}
const nextTo = (map, ch) => { const g = find(map, ch); if (g) for (const [dx, dy] of D4) if (map[g.y + dy]?.[g.x + dx] === ".") return { x: g.x + dx, y: g.y + dy }; };
let MAP = MAPS[1];
const walkable = (x, y) => { const c = MAP[y]?.[x]; return c && !"#DGjBTLPEUFNO".includes(c) && (!LOCKS.includes(c) || !!progress.keys?.[c]) && !(me?.f === 1 && statueAt(x, y)); };

  $("bag").replaceChildren(bagBar(`🎒 단서 가방`),
    el("h3", { textContent: `물건 (${mine().length}/${BAG_MAX})` }),

      : [el("p", { className: "sub", textContent: "가진 물건이 없어요. 친구에게 주려면 바닥에 내려놓으세요." })]),

    el("p", { className: "sub", textContent: `반짝이는 별 옆에서 🔍 조사를 누르면 주워요. 팀원마다 별이 달라요 — 말로 알려 주세요! 아직 못 주운 내 단서 ${left}개` }),

// ── 미니맵: 1~3층 전체 모양 + 팀이 발견한 퍼즐(🔍 못 품, ✅ 품) + 나(주황)·팀원(흰색) + 계단(초록 올라감, 파랑 내려감) ──
const MAP_COLORS = { "#": "#2a2440", ".": "#c9c2b4", ",": "#9aa0a6", D: "#b08a5a", T: "#7a4f2a", B: "#2f5a40", L: "#6c7b93", H: "#c08a4a",
  C: "#7fdc8f", K: "#7fdc8f", R: "#7fdc8f", V: "#7ab8ff", W: "#7ab8ff", X: "#7ab8ff", S: "#ff9a5a", m: "#d9c8b0", Q: "#d9c8b0", z: "#3a3448", P: "#6a7a96", E: "#b08a5a", U: "#e8e4dc", F: "#d9b04a", N: "#c8d8e8", O: "#9aa0a8", j: "#a05050", G: "#c03a3a", "+": "#9c6b3c" };
function renderMinimap() {
  const f = mapFloor ?? 1, M = MAPS[f], W = M[0].length, H = M.length;

  const g = cvm.getContext("2d"); g.scale(2, 2);

    const c = M[y][x]; let col = MAP_COLORS[c] ?? (/\d/.test(c) ? MAP_COLORS["."] : null);
    if (LOCKS.includes(c)) col = progress.keys?.[c] ? MAP_COLORS["+"] : "#e04848";
    if (col) { g.fillStyle = col; g.fillRect(x * s, y * s, s, s); }
  }
  if (f === 1) for (const k of progress.statues ?? STATUE_HOME) { const [x, y] = k.split(",").map(Number); g.fillStyle = "#fff"; g.fillRect(x * s, y * s, s, s); } // 조각상
  g.textAlign = "center"; g.textBaseline = "middle"; g.font = `${Math.max(10, s * 3.2)}px sans-serif`;

  });

  for (const [id, m] of Object.entries(mates)) if (id !== me.uid && m.online && (m.f ?? 1) === f && m.x != null) dot(m.x, m.y, "#fff", Math.max(3, s * 1.3));
  if (me.f === f) dot(me.x, me.y, "#ff7a3d", Math.max(4, s * 1.7));

    el("div", { className: "tabs" }, ...floors.map(k => { const been = k <= (progress.floor ?? 1) || k === me.f; // 팀이 한 번이라도 간 층만(어느 층에 있든 볼 수 있음)
      return el("button", { className: "tab" + (k === f ? " on" : ""), disabled: !been, textContent: been ? `${k}층${k === me.f ? " (여기)" : ""}` : `${k}층 🔒`,
        title: been ? "" : "아직 안 가 본 층", onclick: () => { mapFloor = k; renderMinimap(); } }); })),

// 팀원 누구든 화면에 퍼즐 자리가 보이면 '발견'으로 저장 → 모두의 미니맵에 🔍
const foundSent = new Set();
function markFound(ids) {
  const fresh = ids.filter(id => !progress.found?.[id] && !foundSent.has(id)); if (!fresh.length) return;
  fresh.forEach(id => foundSent.add(id));
  net.changeProgress(p => fresh.every(id => p.found?.[id]) ? undefined : { ...p, found: { ...p.found, ...Object.fromEntries(fresh.map(id => [id, true])) } });
}

const mmss = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
// 물건을 바닥에 놓는 곳: 보충실 안·벽·잠긴 문이면 보충실 문 앞(없으면 모서리 계단 옆)으로 → 아무도 못 가는 곳에 떨어지지 않게
// 이 층 바닥에 이미 놓인 물건 칸(물건끼리 겹치지 않게)
const takenOn = f => new Set(Object.values(items).filter(v => v && !v.by && v.f === f).map(v => v.x + "," + v.y));
function dropAt(id, f, x, y, near = "G") { // near: 그 자리에 못 둘 때 옮길 기준(보충실 문 G, 모서리 계단 K)
  const map = MAPS[f], c = map[y]?.[x], ok = c && !"#jGDBTLH".includes(c) && !LOCKS.includes(c), taken = takenOn(f);
  const target = find(map, near) ?? find(map, "K") ?? find(map, "W");
  const spot = (ok && scatter(map, { x, y }, 1, taken)[0]) || dropSpot(map, target, id, taken); // 그 자리(차 있으면 바로 옆) / 문·계단 2칸 안 복도
  items[id] = { by: null, f, ...spot }; net.setItem(id, items[id]); // 이어서 떨어뜨리는 물건이 같은 칸을 고르지 않게 바로 반영
}
function showEnd() {

// ── 방향키: 원판 하나에서 손가락 각도로 방향 판정 → 버튼 사이로 미끄러져도 끊기지 않음 ──
const pad = $("pad");
function padDir(e) {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < 14) return null; // 가운데는 정지
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u");
}
function setDir(d) {
  dir = d;
  for (const s of pad.children) s.classList.toggle("on", s.classList.contains(d));
}
pad.addEventListener("pointerdown", e => { e.preventDefault(); pad.setPointerCapture(e.pointerId); setDir(padDir(e)); });
pad.addEventListener("pointermove", e => { if (pad.hasPointerCapture(e.pointerId)) setDir(padDir(e)); });
for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) pad.addEventListener(t, () => setDir(null));
// iOS: 두 손가락 확대·길게 누르기 메뉴 차단
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (!e.target.closest("#join, #jail, .modal")) e.preventDefault(); }, { passive:false });
document.addEventListener("contextmenu", e => e.preventDefault());
// PC 테스트용 키보드
const KEYS = { ArrowUp:"u", ArrowDown:"d", ArrowLeft:"l", ArrowRight:"r" };
addEventListener("keydown", e => { if (KEYS[e.key] && me && !e.target.closest("input")) { e.preventDefault(); setDir(KEYS[e.key]); } });
addEventListener("keyup", e => { if (KEYS[e.key] === dir) setDir(null); });

// ── 화면 그리기 ──
const cv = $("cv"), ctx = cv.getContext("2d");
let T = 32;
function resize() {
  const box = $("mapbox").getBoundingClientRect();
  if (box.width < 50 || box.height < 50) return; // 회전 도중의 임시 크기는 무시(0이 되면 지도가 사라짐)
  const land = document.body.classList.contains("land");
  if (land) { VIEW_H = 8; T = Math.ceil(box.height / VIEW_H); VIEW_W = Math.ceil(box.width / T); } // 가로: 세로 8칸에 맞추고 화면 너비를 꽉 채움
  else { VIEW_W = 10; T = Math.ceil(box.width / VIEW_W); VIEW_H = Math.ceil(box.height / T); } // 세로: 가로 10칸에 맞추고 화면 높이를 꽉 채움
  const dpr = Math.min(2, devicePixelRatio || 1); // 3배 화면도 2배로 그림(도트라 차이가 거의 없고 그릴 점이 절반 이하)
  cv.style.width = T * VIEW_W + "px"; cv.style.height = T * VIEW_H + "px";
  cv.width = T * VIEW_W * dpr; cv.height = T * VIEW_H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawKey = "";
}
// window resize는 회전 직후 크기가 덜 바뀐 상태에서 오기도 해서, 지도 칸의 실제 크기 변화를 지켜본다
new ResizeObserver(() => { if (me) resize(); }).observe($("mapbox"));

const sameFloor = m => (m.f ?? 0) === me.f;
// 사물함은 한 칸에 한 명만
const lockerTaken = (x, y) => MAP[y][x] === "H" && Object.entries(mates).some(([id, m]) => id !== me.uid && m.online && !m.jail && sameFloor(m) && m.x === x && m.y === y);

const jailCell = () => { // 이 층 보충실 안 빈칸(갇힌 친구와 겹치지 않게)
  const cells = MAP.flatMap((r, y) => [...r].flatMap((c, x) => c === "j" ? [{ x, y }] : [])), k = Object.values(mates).filter(m => m.jail && sameFloor(m)).length;
  return cells.length ? cells[(k * 3) % cells.length] : { x: me.x, y: me.y };
};
function caughtNow(line = "") {
  // 가진 물건은 잡힌 자리에 하나씩 겹치지 않게 뿌림(2칸 안, 모자라면 3칸). 사물함에서 잡혔으면 사물함 칸은 빼고 그 주변에
  const ids = mine(), spots = scatter(MAP, { x: me.x, y: me.y }, ids.length, takenOn(me.f), MAP[me.y][me.x] !== "H");
  ids.forEach((id, i) => { items[id] = { by: null, f: me.f, ...(spots[i] ?? { x: me.x, y: me.y }) }; net.setItem(id, items[id]); });
  me.jail = net.serverNow() + (meta.jailSec ?? 30) * 1000; hideMs = 0; me.seen = 0; jailLine = line; setDir(null); closeModal();
  Object.assign(me, jailCell()); me.rx = me.x; me.ry = me.y;
  net.addCaught((mates[me.uid]?.caught || 0) + 1); // 보충 명부(감점 없음)
  save(); jailTick();
}

// 방장 기기만: 등장 20초 동안 괴물을 움직여 서버에 올린다.
// 알아챈 학생은 학생보다 10% 빠르게 쫓고, 쫓을 학생이 없으면 느리게 순찰한다. 지하·옥상에는 괴물이 없다
function runMonster(now, ph) {
  const every = mon?.tid ? MON_STEP_MS : PATROL_STEP_MS;
  if (!playing() || ph.phase !== "chase" || now - mStep < every) return;
  const t = net.serverNow(), cur = mon?.n === ph.n && mon.f === me.f ? mon : null;
  const here = Object.fromEntries(Object.entries(mates).filter(([, m]) => sameFloor(m)));
  if (hostOf(here, cur, t, t - ((ph.chase ?? CHASE_MS) - ph.left)) !== me.uid) return;
  mStep = now - mStep < every * 2 ? mStep + every : now; // 화면 주기(16ms)에 밀리지 않고 정확한 간격으로 걸음
  const players = Object.entries(here).filter(([, m]) => m.online && m.x != null)
    .map(([id, m]) => id === me.uid ? { id, x: me.x, y: me.y, jail: me.jail, seen: me.seen } : { id, x: m.x, y: m.y, jail: m.jail, seen: m.seen });
  if (!cur) { // 이번 등장의 첫 순간: 가장 가까운 학생에게서 11~14칸 떨어진 곳에 나타남
    mon = { n: ph.n, f: me.f, ...spawnTile(MAP, players.filter(p => !p.jail), meta.seed ?? 1, ph.n * 7 + me.f), by: me.uid, t, tid: null, h: 0, s0: t, say: "어디 있니~?" };
    mTarget = null; return net.setMonster(mon);
  }
  if (mon.w > t || t - (mon.s0 ?? 0) < LOOK_MS) { mon = { ...mon, by: me.uid, t }; return net.setMonster(mon); } // 문을 지난 뒤 2초·나타난 직후 1.5초는 멈춤(그동안도 '살아 있음'은 알림)
  // 방장이 바뀌었으면 서버에 남은 표적(tid)을 이어받는다
  if (!mTarget && mon.tid) mTarget = { id: mon.tid, x: mon.x, y: mon.y, at: 0 };
  mTarget = nextTarget(MAP, mon, players, mTarget, now);
  const go = mTarget ? { ...stepToward(MAP, mon, mTarget), h: mon.h ?? 0 } : patrolStep(MAP, mon, mon.h ?? 0);
  const { step, say, s1 } = seekStep(MAP, mon, mTarget && players.find(p => p.id === mTarget.id), go, t) ?? { step: go, say: null, s1: 0 }; // 숨는 걸 본 사물함은 열어 봄
  mon = { n: ph.n, f: me.f, ...step, by: me.uid, t, tid: mTarget?.id ?? null, say, s1, s0: mon.s0, w: doorWait(MAP, mon, step, t) }; // 제자리여도 올려서 '살아 있음'을 알림
  net.setMonster(mon);
}

// 화면 위치(rx, ry)를 목표 칸(x, y)으로 한 프레임에 최대 v칸씩 옮김. 2칸 넘게 벌어지면(순간이동·재접속) 바로 그 자리로
function glide(o, x, y, v) {
  if (o.rx == null || Math.abs(o.rx - x) + Math.abs(o.ry - y) > 2) return [x, y];
  const step = (r, t) => Math.abs(t - r) <= v ? t : r + Math.sign(t - r) * v;
  return [step(o.rx, x), step(o.ry, y)];
}

// 한 프레임에서 오류가 나도 게임이 멈추지 않게(다음 프레임은 계속). 같은 오류는 콘솔에 한 번만
let loopErr = "";
function loop(now) {
  try { frame(now); } catch (e) { if (String(e) !== loopErr) { loopErr = String(e); console.error(e); } }
  requestAnimationFrame(loop);
}
function frame(now) {
  if (intro?.active) return intro.frame(now);
  const ph = MONSTER_FLOORS.includes(me.f) ? phaseAt(net.gameMs(meta), meta.seed ?? 1, PZ?.level) : { phase: "rest", n: -1, left: 0 };
  const active = ph.phase === "chase" && mon?.n === ph.n && mon.f === me.f ? mon : null; // 이번 등장·이 층의 괴물만(문 앞에서 멈춘 동안도 보임)
  const monLeft = ph.left;
  setMode(active && !me.jail && playing() ? "chase" : "ambient"); // 보충쌤이 이 층에서 쫓는 동안 추격 음악
  if (dir && playing() && !me.jail && now - lastStep >= STEP_MS) {
    // 계속 누르고 있으면 정확히 140ms 간격으로 걷게(화면 주기 때문에 생기는 미세한 멈칫거림 방지)
    lastStep = now - lastStep < STEP_MS * 2 ? lastStep + STEP_MS : now; me.d = dir;
    const [dx, dy] = DIRS[dir], nx = me.x + dx, ny = me.y + dy;
    const wasHidden = MAP[me.y][me.x] === "H", into = MAP[ny]?.[nx];
    if (into === "H" && net.serverNow() < hideBlockUntil) toast(`🗄️ ${Math.ceil((hideBlockUntil - net.serverNow()) / 1000)}초 뒤에 다시 숨을 수 있어요`, 1500);
    else if (LOCKS.includes(into) && !progress.keys?.[into]) {
      if (items[into]?.by === me.uid) { // 맞는 열쇠를 가졌으면 문을 열고 열쇠는 문에 꽂아 둠(팀 전체에 열림)
        net.changeProgress(p => ({ ...p, keys: { ...p.keys, [into]: true } })) // 문이 열린 게 저장된 뒤에만 열쇠를 없앰(실패하면 열쇠는 그대로)
          .then(r => { if (r?.snapshot?.val()?.keys?.[into]) { net.setItem(into, null); toast("🔓 열쇠로 문을 열었다!", 2500); } });
      } else toast(`🔒 잠겨 있어요. ${ITEM[into]?.slice(2) ?? "열쇠"}가 필요해요`, 2000);

  for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4 - Math.PI / 2, d = i % 2 ? r * 0.22 : r; ctx.lineTo(x + Math.cos(ang) * d, y + Math.sin(ang) * d); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
const WALK_MS = 160; // 걸음 모션 한 박자
// 화면 위치가 목표 칸을 따라가는 중이면 걸음(1·2 번갈아), 아니면 서 있기(0)
const walkFrame = (o, x, y) => Math.abs(o.rx - x) + Math.abs(o.ry - y) > 0.02 ? 1 + Math.floor(performance.now() / WALK_MS) % 2 : 0;
function drawChar(o, av, nick, cx, cy, mine) {
  const px = (o.rx - cx) * T + T / 2, py = (o.ry - cy) * T + T / 2;
  if (mine) { ctx.beginPath(); ctx.ellipse(px, py + T * 0.4, T * 0.42, T * 0.13, 0, 0, Math.PI * 2); ctx.fillStyle = "#ff7a3d99"; ctx.fill(); } // 내 캐릭터 발밑 표시
  ctx.drawImage(sprite(av ?? 0, o.d || "d", walkFrame(o, o.x, o.y)), px - T / 2, py - T * 0.55, T, T);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(10, T * 0.32)}px sans-serif`;
  ctx.fillText(nick, px, py - T * 0.62 < 8 ? py + T * 0.62 : py - T * 0.62); // 맨 윗줄이면 이름표를 아래에
}
</script>
